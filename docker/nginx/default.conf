map $request_uri $campement_request_path {
    ~^([^?]*) $1;
}

map $campement_request_path $campement_safe_request_path {
    "~^/distribution/[0-9a-fA-F-]{36}$" /distribution/[JETON_MASQUE];
    "~^/reinitialiser-mot-de-passe/[0-9a-fA-F]{64}$" /reinitialiser-mot-de-passe/[JETON_MASQUE];
    default $campement_request_path;
}

log_format campement_safe '$time_iso8601 "$request_method $campement_safe_request_path $server_protocol" '
                           '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /var/www/app/public;
    index index.php;

    client_max_body_size 20M;

    # Les URL publiques peuvent contenir des jetons. Le format dédié retire
    # tous les paramètres et masque les segments sensibles avant écriture.
    access_log /var/log/nginx/access.log campement_safe;
    # Les erreurs Nginx de niveau courant incluent l'URI brute. Seuls les
    # incidents critiques sont conservés ici ; les erreurs applicatives restent
    # disponibles dans les journaux PHP après passage par le filtre Monolog.
    error_log /var/log/nginx/error.log crit;

    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_hide_header X-Powered-By;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
