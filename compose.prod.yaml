x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  php:
    logging: *production-logging
    image: "campement-php-production:${APP_IMAGE_TAG:-local}"
    build:
      target: php-production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
    read_only: true
    user: www-data
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?APP_SECRET doit etre renseigne en production}"
      DEFAULT_URI: "${DEFAULT_URI:-http://localhost:8080}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:8080}"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MAILER_FROM_EMAIL: "${MAILER_FROM_EMAIL:-no-reply@neitsab.net}"
      MAILER_FROM_NAME: "${MAILER_FROM_NAME:-Campement}"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN:-sync://}"
      DATABASE_URL: "postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8"
      TRUSTED_HOST_PATTERN: "${TRUSTED_HOST_PATTERN:-^(localhost|127\\.0\\.0\\.1)$}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
    volumes: !override
      - documents_participants:/var/www/app/var/documents_participants
    tmpfs:
      - /tmp:mode=1777
      - /var/www/app/var/cache:mode=0770,uid=33,gid=33
      - /var/www/app/var/log:mode=0770,uid=33,gid=33
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  nginx:
    logging: *production-logging
    image: "campement-nginx-production:${APP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: nginx-production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
        NGINX_VERSION: "${NGINX_VERSION}"
        NGINX_IMAGE_DIGEST: "${NGINX_IMAGE_DIGEST:-sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de}"
    read_only: true
    user: nginx
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes: !override []
    tmpfs:
      - /var/cache/nginx:mode=0750,uid=101,gid=101
      - /var/log/nginx:mode=0750,uid=101,gid=101
      - /var/run:mode=0750,uid=101,gid=101
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  maintenance:
    logging: *production-logging
    restart: unless-stopped
    image: "campement-php-production:${APP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: php-production
      args:
        PHP_VERSION: "${PHP_VERSION}"
        PHP_IMAGE_DIGEST: "${PHP_IMAGE_DIGEST:-sha256:9467f10bf42897dec0abb73ee20c747ebd45463ec9d6fcc4044cb83eba6dade7}"
    working_dir: /var/www/app
    entrypoint: ["campement-maintenance"]
    read_only: true
    user: www-data
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?APP_SECRET doit etre renseigne en production}"
      DEFAULT_URI: "${DEFAULT_URI:-http://localhost:8080}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://localhost:8080}"
      MAILER_DSN: "${MAILER_DSN:-null://null}"
      MAILER_FROM_EMAIL: "${MAILER_FROM_EMAIL:-no-reply@neitsab.net}"
      MAILER_FROM_NAME: "${MAILER_FROM_NAME:-Campement}"
      MESSENGER_TRANSPORT_DSN: "${MESSENGER_TRANSPORT_DSN:-sync://}"
      DATABASE_URL: "postgresql://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8"
      TRUSTED_HOST_PATTERN: "${TRUSTED_HOST_PATTERN:-^(localhost|127\\.0\\.0\\.1)$}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
    volumes: !override
      - documents_participants:/var/www/app/var/documents_participants
    tmpfs:
      - /tmp:mode=1777
      - /var/www/app/var/cache:mode=0770,uid=33,gid=33
      - /var/www/app/var/log:mode=0770,uid=33,gid=33
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campement

  backup:
    logging: *production-logging
    restart: unless-stopped
    image: "campement-backup:${APP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      target: backup-runtime
      args:
        POSTGRES_VERSION: "${POSTGRES_VERSION}"
        POSTGRES_IMAGE_DIGEST: "${POSTGRES_IMAGE_DIGEST:-sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}"
        AGE_PACKAGE_VERSION: "${AGE_PACKAGE_VERSION:-1.3.1-r5}"
    read_only: true
    user: postgres
    group_add:
      - "33"
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_BACKUP_USER}"
      PGPASSWORD: "${POSTGRES_BACKUP_PASSWORD}"
      BACKUP_AGE_RECIPIENT: "${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT doit être renseigné}"
    volumes:
      - documents_participants:/documents:ro
      - "${BACKUP_DIR:-./var/backups}:/backups"
    tmpfs:
      - /tmp:mode=1777
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campement

  database:
    logging: *production-logging
    image: "campement-postgres-production:${APP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      target: postgres-runtime
      args:
        POSTGRES_VERSION: "${POSTGRES_VERSION}"
        POSTGRES_IMAGE_DIGEST: "${POSTGRES_IMAGE_DIGEST:-sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15}"
    read_only: true
    user: postgres
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_APP_USER: "${POSTGRES_APP_USER}"
      POSTGRES_APP_PASSWORD: "${POSTGRES_APP_PASSWORD:-}"
      POSTGRES_MIGRATOR_USER: "${POSTGRES_MIGRATOR_USER}"
      POSTGRES_MIGRATOR_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD:-}"
      POSTGRES_BACKUP_USER: "${POSTGRES_BACKUP_USER}"
      POSTGRES_BACKUP_PASSWORD: "${POSTGRES_BACKUP_PASSWORD:-}"
      POSTGRES_HEALTHCHECK_USER: "${POSTGRES_HEALTHCHECK_USER}"
      POSTGRES_HEALTHCHECK_PASSWORD: "${POSTGRES_HEALTHCHECK_PASSWORD:-}"
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - "${POSTGRES_HBA_FILE:-./docker/postgres/pg_hba.prod.conf.example}:/etc/postgresql/pg_hba.conf:ro"
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:mode=0775,uid=70,gid=70
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256

  liquibase:
    logging: *production-logging
    image: "campement-liquibase-production:${APP_IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/liquibase/Dockerfile
      target: liquibase-runtime
      args:
        LIQUIBASE_VERSION: "${LIQUIBASE_VERSION}"
        LIQUIBASE_IMAGE_DIGEST: "${LIQUIBASE_IMAGE_DIGEST:-sha256:dfe136c26d39088d87d1bd27f833d6ac5b738a180d7c960b065c7be525725d01}"
    read_only: true
    user: liquibase
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777
    volumes: !override []
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      LIQUIBASE_COMMAND_USERNAME: "${POSTGRES_MIGRATOR_USER}"
      LIQUIBASE_COMMAND_PASSWORD: "${POSTGRES_MIGRATOR_PASSWORD}"

networks:
  campement:
    ipam:
      config:
        - subnet: "${CAMP_NETWORK_SUBNET:-172.30.0.0/16}"
