name: Publication des images

on:
  workflow_dispatch:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publication-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publier-candidat:
    name: Publier le candidat ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php
            file: docker/php/Dockerfile
            target: php-production
          - image: nginx
            file: docker/php/Dockerfile
            target: nginx-production
          - image: postgres
            file: docker/postgres/Dockerfile
            target: postgres-runtime
          - image: liquibase
            file: docker/liquibase/Dockerfile
            target: liquibase-runtime
          - image: backup
            file: docker/postgres/Dockerfile
            target: backup-runtime

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir le nom et l'etiquette immuable
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/campement-app-${{ matrix.image }}" >> "$GITHUB_ENV"
          echo "CANDIDATE_TAG=sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire et publier le candidat avec SBOM et provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ env.CANDIDATE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=publication-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publication-${{ matrix.image }}

      - name: Valider le digest construit
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! printf '%s\n' "$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "Digest construit invalide : ${IMAGE_DIGEST}" >&2
            exit 1
          fi

      - name: Signer le candidat avec Sigstore
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

      - name: Afficher la reference immuable
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${REGISTRY_IMAGE}@${IMAGE_DIGEST}"

  tester-candidats:
    name: Tester les images candidates
    if: github.ref == 'refs/heads/main'
    needs: publier-candidat
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Installer Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resoudre les cinq digests candidats
        shell: bash
        run: |
          . ./scripts/registry-helpers.sh
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          for image in $(release_image_names); do
            depot="ghcr.io/${proprietaire}/campement-app-${image}"
            candidat="${depot}:sha-${GITHUB_SHA}"
            if ! digest=$(registry_resolve_digest_with_retry "$candidat"); then
              echo "Image candidate absente ou digest invalide : ${candidat}" >&2
              exit 1
            fi
            variable="CAMP_RELEASE_${image^^}_IMAGE"
            echo "${variable}=${depot}@${digest}" >> "$GITHUB_ENV"
          done
          echo "CAMP_RELEASE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Verifier les signatures Sigstore
        run: ./scripts/verify-release-images.sh

      - name: Preparer la configuration isolee
        run: ./scripts/ci-prepare-env.sh

      - name: Tester exactement les images candidates
        env:
          COMPOSE_PROJECT_NAME: campement-release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          NGINX_HOST_PORT: 18083
          POSTGRES_HOST_PORT: 15437
          USE_RELEASE_IMAGES: "1"
        run: |
          export SMOKE_BACKUP_IMAGE="$CAMP_RELEASE_BACKUP_IMAGE"
          export SMOKE_POSTGRES_IMAGE="$CAMP_RELEASE_POSTGRES_IMAGE"
          ./scripts/ci-production-smoke.sh

  deployer-recette:
    name: Déclencher le déploiement en recette
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tester-candidats
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Prévenir le dépôt de déploiement
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_DEPLOY_DISPATCH_TOKEN }}
          CANDIDATE_GIT_SHA: ${{ github.sha }}
          DEPLOY_REPOSITORY: NeitsabLc/homelab-deploy
        shell: bash
        run: |
          if ! printf '%s\n' "$CANDIDATE_GIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "SHA candidat invalide : ${CANDIDATE_GIT_SHA}" >&2
            exit 1
          fi

          jq -n \
            --arg git_sha "$CANDIDATE_GIT_SHA" \
            '{
              event_type: "campement-candidate-ready",
              client_payload: {
                application: "campement",
                git_sha: $git_sha
              }
            }' \
            | gh api \
                --method POST \
                "repos/${DEPLOY_REPOSITORY}/dispatches" \
                --input -

          echo "Déploiement en recette demandé pour ${CANDIDATE_GIT_SHA}."

  valider-tag:
    name: Valider la version a promouvoir
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Recuperer l'historique Git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verifier la release, le tag et leur appartenance a main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Le tag doit respecter vMAJEUR.MINEUR.CORRECTIF." >&2
            exit 1
          fi
          objet_tag=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")
          type_tag=$(jq -r '.object.type' <<<"$objet_tag")
          cible_tag=$(jq -r '.object.sha' <<<"$objet_tag")

          case "$type_tag" in
            commit)
              release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")
              if [ "$(jq -r '.draft' <<<"$release")" != false ] \
                || [ "$(jq -r '.prerelease' <<<"$release")" != false ] \
                || [ "$(jq -r '.published_at != null' <<<"$release")" != true ] \
                || [ "$(jq -r '.tag_name' <<<"$release")" != "$GITHUB_REF_NAME" ] \
                || [ "$(jq -r '.author.login | ascii_downcase' <<<"$release")" != "${GITHUB_REPOSITORY_OWNER,,}" ]; then
                echo "La release automatique associee au tag est invalide." >&2
                exit 1
              fi
              git_sha=$cible_tag
              ;;
            tag)
              tag_annote=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${cible_tag}")
              if [ "$(jq -r '.verification.verified' <<<"$tag_annote")" != true ]; then
                echo "La signature du tag annote n'est pas validee par GitHub." >&2
                exit 1
              fi
              if [ "$(jq -r '.object.type' <<<"$tag_annote")" != commit ]; then
                echo "Le tag annote ne designe pas directement un commit." >&2
                exit 1
              fi
              git_sha=$(jq -r '.object.sha' <<<"$tag_annote")
              ;;
            *)
              echo "Type de tag Git inattendu : ${type_tag}" >&2
              exit 1
              ;;
          esac

          if [ "$git_sha" != "$GITHUB_SHA" ]; then
            echo "Le tag ne designe pas le commit attendu par le workflow." >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$git_sha" origin/main

      - name: Attendre la validation des images candidates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for tentative in $(seq 1 54); do
            if ! etat=$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-images.yaml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$GITHUB_SHA" \
                -f per_page=10 \
                --jq '.workflow_runs | sort_by(.created_at) | last | if . == null then "absent" elif .status != "completed" then .status else .conclusion end'); then
              etat=indisponible
            fi

            case "$etat" in
              success)
                echo "Les images candidates de ${GITHUB_SHA} ont ete validees."
                exit 0
                ;;
              absent|indisponible|queued|in_progress|pending|requested|waiting)
                if [ "$tentative" -lt 54 ]; then
                  echo "Validation candidate ${etat}, nouvelle tentative dans 10 secondes."
                  sleep 10
                fi
                ;;
              *)
                echo "La publication candidate de ${GITHUB_SHA} a termine avec l'etat ${etat}." >&2
                exit 1
                ;;
            esac
          done

          echo "Validation candidate indisponible apres 9 minutes pour ${GITHUB_SHA}." >&2
          exit 1

  promouvoir-version:
    name: Promouvoir ${{ matrix.image }} sans reconstruire
    if: startsWith(github.ref, 'refs/tags/v')
    needs: valider-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        image:
          - php
          - nginx
          - postgres
          - liquibase
          - backup

    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir les references
        shell: bash
        run: |
          proprietaire="${GITHUB_REPOSITORY_OWNER,,}"
          version="${GITHUB_REF_NAME#v}"
          {
            echo "REGISTRY_IMAGE=ghcr.io/${proprietaire}/campement-app-${{ matrix.image }}"
            echo "CANDIDATE_TAG=sha-${GITHUB_SHA}"
            echo "VERSION=${version}"
          } >> "$GITHUB_ENV"

      - name: Se connecter a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . ./scripts/registry-helpers.sh
          registry_login_with_retry ghcr.io "$GITHUB_ACTOR" "$GHCR_TOKEN"

      - name: Promouvoir exactement le digest candidat
        shell: bash
        run: |
          . ./scripts/registry-helpers.sh
          candidat="${REGISTRY_IMAGE}:${CANDIDATE_TAG}"
          if ! digest=$(registry_resolve_digest_with_retry "$candidat"); then
            echo "Image candidate absente ou digest invalide : ${candidat}" >&2
            exit 1
          fi

          digest_promu=$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${VERSION}" 2>/dev/null | awk '$1 == "Digest:" { print $2; exit }') || digest_promu=""
          if [ "$digest_promu" = "$digest" ]; then
            echo "${REGISTRY_IMAGE}:${VERSION} deja promue vers ${digest}"
            exit 0
          fi

          source_immuable="${REGISTRY_IMAGE}@${digest}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${REGISTRY_IMAGE}:${VERSION}" \
            "$source_immuable"

          digest_promu=$(registry_resolve_digest_with_retry "${REGISTRY_IMAGE}:${VERSION}")
          if [ "$digest_promu" != "$digest" ]; then
            echo "Digest promu incorrect pour ${REGISTRY_IMAGE}:${VERSION}" >&2
            exit 1
          fi

          echo "${REGISTRY_IMAGE}:${VERSION} -> ${digest}"
