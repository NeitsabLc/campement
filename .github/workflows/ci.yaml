name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: campement-ci-${{ github.run_id }}-${{ github.run_attempt }}
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
  npm_config_fetch_retries: 3
  npm_config_fetch_retry_mintimeout: 10000
  npm_config_fetch_retry_maxtimeout: 60000
  npm_config_fetch_timeout: 120000
  COMPOSER_MAX_PARALLEL_HTTP: 4

jobs:
  titre-pr:
    name: Convention du titre de PR
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Valider le titre Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          motif='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|security|revert)(\([[:alnum:]_.\/-]+\))?!?: .+'
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "$motif"; then
            echo 'Le titre doit suivre Conventional Commits.' >&2
            echo 'Exemples : feat: ajouter un export, fix(auth): corriger la connexion.' >&2
            exit 1
          fi

  qualite-rapide:
    name: Qualite rapide
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Valider la version applicative
        shell: bash
        run: |
          version=$(tr -d '\r\n' <version.txt)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version SemVer invalide : ${version}" >&2
            exit 1
          fi
          grep -Fqx \
            "    app.version: '${version}' # x-release-please-version" \
            app/config/services.yaml

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Definir la version du cache Trivy
        id: trivy-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-${{ runner.os }}-${{ steps.trivy-cache.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Rechercher des secrets dans les fichiers versionnes
        run: |
          mkdir -p .cache/trivy
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src:ro" \
            --volume "$GITHUB_WORKSPACE/.cache/trivy:/trivy-cache" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            --cache-dir /trivy-cache \
            filesystem --scanners secret --skip-dirs /src/.git \
            --exit-code 1 --no-progress /src

      - name: Preparer la configuration de CI
        run: ./scripts/ci-prepare-env.sh

      - name: Valider la configuration Docker Compose
        run: |
          docker compose config --quiet
          POSTGRES_HEALTHCHECK_USER=campement_admin \
            docker compose -f compose.yaml -f compose.prod.yaml config --quiet
          digest="sha256:$(printf '0%.0s' {1..64})"
          export CAMP_RELEASE_PHP_IMAGE="ghcr.io/neitsablc/campement-app-php@${digest}"
          export CAMP_RELEASE_NGINX_IMAGE="ghcr.io/neitsablc/campement-app-nginx@${digest}"
          export CAMP_RELEASE_POSTGRES_IMAGE="ghcr.io/neitsablc/campement-app-postgres@${digest}"
          export CAMP_RELEASE_LIQUIBASE_IMAGE="ghcr.io/neitsablc/campement-app-liquibase@${digest}"
          export CAMP_RELEASE_BACKUP_IMAGE="ghcr.io/neitsablc/campement-app-backup@${digest}"
          docker compose -f compose.yaml -f compose.prod.yaml -f compose.release.yaml config --quiet
          test -z "$(docker compose -f compose.yaml -f compose.prod.yaml -f compose.release.yaml config --format json | jq -r '.services[] | select(.build != null) | .image')"

      - name: Installer les dependances Node.js
        run: npm ci --no-audit --no-fund

      - name: Auditer les dependances npm avec Trivy
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src:ro" \
            --volume "$GITHUB_WORKSPACE/.cache/trivy:/trivy-cache" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            --cache-dir /trivy-cache \
            filesystem --scanners vuln --include-dev-deps \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress \
            /src/package-lock.json

  tests-app:
    name: Tests applicatifs
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restaurer le cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('app/composer.lock') }}

      - name: Preparer la configuration de CI
        run: ./scripts/ci-prepare-env.sh

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installer les dependances Node.js
        run: npm ci --no-audit --no-fund

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire l'image PHP de CI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/php/Dockerfile
          target: php-development
          load: true
          pull: true
          tags: ${{ env.COMPOSE_PROJECT_NAME }}-php:latest
          cache-from: type=gha,scope=ci-php-development
          cache-to: type=gha,mode=max,scope=ci-php-development

      - name: Installer les dependances PHP
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
        run: |
          mkdir -p .cache/composer
          for tentative in 1 2 3; do
            if docker compose run --rm \
              --env COMPOSER_AUTH \
              --env COMPOSER_MAX_PARALLEL_HTTP \
              --env COMPOSER_CACHE_DIR=/composer-cache \
              --volume "$GITHUB_WORKSPACE/.cache/composer:/composer-cache" \
              php composer install --no-interaction --prefer-dist --no-progress --no-scripts; then
              break
            fi
            if [ "$tentative" -eq 3 ]; then
              exit 1
            fi
            sleep "$((tentative * 5))"
          done

      - name: Demarrer l'application
        run: |
          docker compose up --detach database php nginx
          APP_BASE_URL="http://$(docker compose port nginx 8080)"
          echo "APP_BASE_URL=${APP_BASE_URL}" >> "$GITHUB_ENV"

      - name: Valider Composer
        run: docker compose exec --no-TTY php composer validate --strict --no-check-publish

      - name: Auditer les dependances Composer
        run: docker compose exec --no-TTY php composer audit --locked --no-interaction

      - name: Auditer les dependances Importmap
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker compose exec --no-TTY -e GITHUB_TOKEN php php bin/console importmap:audit

      - name: Valider les changelogs Liquibase
        run: docker compose --profile tools run --rm liquibase validate

      - name: Valider les mappings Doctrine
        run: >-
          docker compose exec --no-TTY php
          php bin/console doctrine:schema:validate --skip-sync

      - name: Compiler les assets
        run: |
          docker compose exec --no-TTY php php bin/console cache:clear --env=prod --no-debug
          for tentative in 1 2 3; do
            docker compose exec --no-TTY php php bin/console importmap:install && break
            test "$tentative" -lt 3 || exit 1
            sleep "$((tentative * 5))"
          done
          docker compose exec --no-TTY php php bin/console asset-map:compile --env=prod --no-debug

      - name: Analyser statiquement le code PHP
        run: |
          docker compose exec --no-TTY php php bin/console cache:warmup --env=dev
          docker compose exec --no-TTY php vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Controler le style PHP
        run: docker compose exec --no-TTY php composer lint:php

      - name: Reinitialiser la base de tests
        run: |
          POSTGRES_DB="$(docker compose exec --no-TTY database printenv POSTGRES_DB)"
          TEST_DATABASE="${POSTGRES_DB}_test"
          docker compose exec --no-TTY database sh -c \
            'dropdb --username="$POSTGRES_USER" --force --if-exists "$1"' sh "$TEST_DATABASE"
          docker compose exec --no-TTY database sh -c \
            'createdb --username="$POSTGRES_USER" --owner="$POSTGRES_USER" "$1"' sh "$TEST_DATABASE"
          docker compose --profile tools run --rm \
            -e "LIQUIBASE_COMMAND_URL=jdbc:postgresql://database:5432/${TEST_DATABASE}" \
            liquibase update --context-filter=dev

      - name: Executer les tests
        run: docker compose exec --no-TTY php php bin/phpunit

      - name: Initialiser les donnees de controle
        run: docker compose --profile tools run --rm liquibase update --context-filter=dev

      - name: Attendre que l'application soit disponible
        run: curl --fail --retry 30 --retry-delay 2 --retry-all-errors "${APP_BASE_URL}/login"

      - name: Executer les controles d'accessibilite
        run: ./scripts/run-playwright-ci.sh test:accessibility

      - name: Executer les tests E2E
        run: ./scripts/run-playwright-ci.sh test:e2e

      - name: Conserver les resultats Playwright en cas d'echec
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Afficher les journaux en cas d'echec
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 database php nginx

      - name: Arreter les services
        if: always()
        run: docker compose down --volumes --remove-orphans

  images-securite:
    name: Image ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: php
            file: docker/php/Dockerfile
            target: php-production
            tag: campement-php-production:local
          - image: nginx
            file: docker/php/Dockerfile
            target: nginx-production
            tag: campement-nginx-production:local
          - image: postgres
            file: docker/postgres/Dockerfile
            target: postgres-runtime
            tag: campement-postgres-production:local
          - image: liquibase
            file: docker/liquibase/Dockerfile
            target: liquibase-runtime
            tag: campement-liquibase-production:local
          - image: backup
            file: docker/postgres/Dockerfile
            target: backup-runtime
            tag: campement-backup:local
    steps:
      - name: Recuperer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir la version du cache Trivy
        id: trivy-cache
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restaurer le cache Trivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-${{ runner.os }}-${{ steps.trivy-cache.outputs.date }}
          restore-keys: |
            trivy-${{ runner.os }}-

      - name: Configurer Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Construire l'image ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          pull: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=ci-runtime-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-runtime-${{ matrix.image }}

      - name: Analyser les vulnerabilites de l'image
        env:
          IMAGE_TAG: ${{ matrix.tag }}
        run: |
          mkdir -p .cache/trivy
          docker save "$IMAGE_TAG" --output /tmp/image.tar
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume /tmp:/scan:ro \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$GITHUB_WORKSPACE/.cache/trivy:/trivy-cache" \
            ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            --cache-dir /trivy-cache \
            image --input /scan/image.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore.yaml \
            --ignore-unfixed \
            --exit-code 1

  resultat-ci:
    name: Resultat final
    if: always()
    needs:
      - titre-pr
      - qualite-rapide
      - tests-app
      - images-securite
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verifier tous les jobs requis
        env:
          TITRE_RESULTAT: ${{ needs.titre-pr.result }}
          QUALITE_RESULTAT: ${{ needs.qualite-rapide.result }}
          TESTS_RESULTAT: ${{ needs.tests-app.result }}
          IMAGES_RESULTAT: ${{ needs.images-securite.result }}
        run: |
          for resultat in \
            "$TITRE_RESULTAT" \
            "$QUALITE_RESULTAT" \
            "$TESTS_RESULTAT" \
            "$IMAGES_RESULTAT"; do
            test "$resultat" = success || exit 1
          done
