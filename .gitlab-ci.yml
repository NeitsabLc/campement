workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore[(]release[)]: v[0-9]+[.][0-9]+[.][0-9]+( .*)?$/'

stages:
  - validate
  - test
  - security
  - maintenance
  - release
  - publish
  - deploy

variables:
  GIT_DEPTH: "0"
  COMPOSE_PROJECT_NAME: "campement-ci-$CI_PIPELINE_ID-$CI_JOB_ID"
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e"
  NODE_IMAGE: "node:24.13.0-alpine@sha256:cd6fb7efa6490f039f3471a189214d5f548c11df1ff9e5b181aa49e22c14383e"
  DOCKER_DIND_IMAGE: "docker:27.5.1-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce"
  TRIVY_IMAGE: "ghcr.io/aquasecurity/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c"
  BETTERLEAKS_IMAGE: "ghcr.io/betterleaks/betterleaks:v1.7.2@sha256:1eb5e0920b47afe43f76671bc678c9fd4fd40c2d0c9b88a16f28021fd12d2347"
  COSIGN_IMAGE: "ghcr.io/sigstore/cosign/cosign:v3.1.2@sha256:d91bc4e7e95e8d2f549c747a72dc174f90579e410a1695f57f686674f84ce849"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_DRIVER: "overlay2"
  BUILDKIT_PROGRESS: "plain"
  npm_config_fetch_retries: "3"
  npm_config_fetch_retry_mintimeout: "10000"
  npm_config_fetch_retry_maxtimeout: "60000"
  npm_config_fetch_timeout: "120000"
  COMPOSER_MAX_PARALLEL_HTTP: "4"
  CACHE_COMPRESSION_FORMAT: "zip"
  CACHE_COMPRESSION_LEVEL: "fastest"

default:
  tags:
    - local-build
  image:
    name: "$NODE_IMAGE"
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
        - app/composer.lock
      prefix: "$CI_PROJECT_PATH_SLUG-dependencies"
    paths:
      - .npm/
      - .cache/composer/

.docker-job:
  image:
    name: "$NODE_IMAGE"
  services:
    - name: "$DOCKER_DIND_IMAGE"
      alias: docker
  before_script:
    - apk add --no-cache bash coreutils curl docker-cli docker-cli-buildx docker-cli-compose git jq openssl
    - until docker info >/dev/null 2>&1; do sleep 1; done

.mr-only:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

conventional-title:
  stage: validate
  extends: .mr-only
  cache: []
  script:
    - |
      motif='^(feat|fix|perf|refactor|deps|docs|test|build|ci|chore|style|security|revert)(\([[:alnum:]_.\/-]+\))?!?: .+'
      printf '%s\n' "$CI_MERGE_REQUEST_TITLE" | grep -Eq "$motif" || {
        echo "Le titre de la MR doit suivre Conventional Commits." >&2
        exit 1
      }

quick-quality:
  stage: validate
  extends:
    - .docker-job
    - .mr-only
  script:
    - |
      version=$(tr -d '\r\n' <version.txt)
      printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      grep -Fqx "    app.version: '$version' # x-release-version" app/config/services.yaml
    - ./scripts/ci-prepare-env.sh
    - set -a; . ./.ci.env; set +a
    - docker compose config --quiet
    - POSTGRES_HEALTHCHECK_USER=campement_admin docker compose -f compose.yaml -f compose.prod.yaml config --quiet
    - |
      digest="sha256:$(printf '0%.0s' $(seq 1 64))"
      export CAMP_RELEASE_PHP_IMAGE="$CI_REGISTRY_IMAGE/php@$digest"
      export CAMP_RELEASE_NGINX_IMAGE="$CI_REGISTRY_IMAGE/nginx@$digest"
      export CAMP_RELEASE_POSTGRES_IMAGE="$CI_REGISTRY_IMAGE/postgres@$digest"
      export CAMP_RELEASE_LIQUIBASE_IMAGE="$CI_REGISTRY_IMAGE/liquibase@$digest"
      export CAMP_RELEASE_BACKUP_IMAGE="$CI_REGISTRY_IMAGE/backup@$digest"
      docker compose -f compose.yaml -f compose.prod.yaml -f compose.release.yaml config --quiet
      test -z "$(docker compose -f compose.yaml -f compose.prod.yaml -f compose.release.yaml config --format json | jq -r '.services[] | select(.build != null) | .image')"
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund

trivy-filesystem:
  stage: security
  extends:
    - .docker-job
    - .mr-only
  cache: &trivy_cache
    key: "$CI_PROJECT_PATH_SLUG-trivy"
    paths:
      - .cache/trivy/
    policy: pull-push
  script:
    - mkdir -p .cache/trivy
    - |
      docker run --rm \
        --volume "$CI_PROJECT_DIR:/src:ro" \
        --volume "$CI_PROJECT_DIR/.cache/trivy:/trivy-cache" \
        "$TRIVY_IMAGE" --cache-dir /trivy-cache filesystem \
        --scanners secret,vuln --include-dev-deps \
        --severity HIGH,CRITICAL --exit-code 1 --no-progress /src

betterleaks:
  stage: security
  extends:
    - .docker-job
    - .mr-only
  cache: []
  script:
    - |
      base_sha="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$CI_MERGE_REQUEST_TARGET_BRANCH_SHA}"
      docker run --rm --volume "$CI_PROJECT_DIR:/src" "$BETTERLEAKS_IMAGE" \
        git /src --log-opts="$base_sha..$CI_COMMIT_SHA" --report-path /src/betterleaks.sarif --report-format sarif
      rm -rf .betterleaks-worktree
      mkdir .betterleaks-worktree
      git archive HEAD | tar -x -C .betterleaks-worktree
      docker run --rm --volume "$CI_PROJECT_DIR/.betterleaks-worktree:/src:ro" "$BETTERLEAKS_IMAGE" \
        dir /src --config /src/.betterleaks-baseline.toml --redact --verbose
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - betterleaks.sarif

application-tests:
  stage: test
  extends:
    - .docker-job
    - .mr-only
  variables:
    BUILDX_BUILDER: "application-tests-$CI_PIPELINE_ID-$CI_JOB_ID"
    BUILDX_CONTEXT: "application-tests-context-$CI_PIPELINE_ID-$CI_JOB_ID"
  timeout: 30 minutes
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker context create "$BUILDX_CONTEXT" >/dev/null
    - docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --use "$BUILDX_CONTEXT" >/dev/null
    - docker buildx inspect --bootstrap >/dev/null
    - ./scripts/ci-application-tests.sh
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - test-results/
  after_script:
    - docker compose down --volumes --remove-orphans || true
    - docker buildx rm "$BUILDX_BUILDER" >/dev/null 2>&1 || true
    - docker context rm --force "$BUILDX_CONTEXT" >/dev/null 2>&1 || true

production-smoke:
  stage: test
  extends:
    - .docker-job
    - .mr-only
  cache: []
  timeout: 30 minutes
  script:
    - ./scripts/ci-prepare-env.sh
    - set -a; . ./.ci.env; set +a
    - export COMPOSE_PROJECT_NAME="campement-smoke-$CI_PIPELINE_ID-$CI_JOB_ID"
    - export NGINX_HOST_PORT="18082"
    - export POSTGRES_HOST_PORT="15436"
    - ./scripts/ci-production-smoke.sh
  after_script:
    - docker compose down --volumes --remove-orphans || true

runtime-images:
  stage: security
  extends:
    - .docker-job
    - .mr-only
  cache:
    <<: *trivy_cache
    policy: pull
  variables:
    BUILDX_BUILDER: "runtime-images-$CI_PIPELINE_ID-$CI_JOB_ID"
    BUILDX_CONTEXT: "runtime-images-context-$CI_PIPELINE_ID-$CI_JOB_ID"
  timeout: 90 minutes
  script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
    - docker context create "$BUILDX_CONTEXT" >/dev/null
    - docker buildx create --name "$BUILDX_BUILDER" --driver docker-container --use "$BUILDX_CONTEXT" >/dev/null
    - docker buildx inspect --bootstrap >/dev/null
    - mkdir -p .cache/trivy
    - |
      for definition in \
        "php|docker/php/Dockerfile|php-production" \
        "nginx|docker/php/Dockerfile|nginx-production" \
        "postgres|docker/postgres/Dockerfile|postgres-runtime" \
        "liquibase|docker/liquibase/Dockerfile|liquibase-runtime" \
        "backup|docker/postgres/Dockerfile|backup-runtime"; do
        image=${definition%%|*}
        rest=${definition#*|}
        dockerfile=${rest%%|*}
        target=${rest#*|}
        local_tag="campement-$image:$CI_PIPELINE_ID"
        docker buildx build . --file "$dockerfile" --target "$target" --pull --load --tag "$local_tag" \
          --cache-from "type=registry,ref=$CI_REGISTRY_IMAGE/cache/$image"
        archive="$CI_PROJECT_DIR/.cache/trivy/$image.tar"
        docker save "$local_tag" --output "$archive"
        docker run --rm \
          --volume "$CI_PROJECT_DIR:/src:ro" \
          --volume "$CI_PROJECT_DIR/.cache/trivy:/trivy-cache" \
          "$TRIVY_IMAGE" --cache-dir /trivy-cache image \
          --input "/trivy-cache/$image.tar" --scanners vuln \
          --severity HIGH,CRITICAL --ignorefile /src/.trivyignore.yaml \
          --ignore-unfixed --exit-code 1 --no-progress
        rm -f "$archive"
      done
  after_script:
    - docker buildx rm "$BUILDX_BUILDER" >/dev/null 2>&1 || true
    - docker context rm --force "$BUILDX_CONTEXT" >/dev/null 2>&1 || true

renovate:
  stage: maintenance
  image:
    name: "renovate/renovate:44.69.11@sha256:9cc4b2b588d8fb655d0f298f36f259f08ddafce6c108023badd85de1b278b5bc"
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: "$CI_API_V4_URL"
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_TOKEN: "$RENOVATE_GITLAB_TOKEN"
  cache: []
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_RENOVATE == "true" && $RENOVATE_GITLAB_TOKEN'

prepare-release-mr:
  stage: release
  image:
    name: "$NODE_IMAGE"
  interruptible: false
  resource_group: release
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run release:prepare-mr
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_RELEASE == "true"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true

create-release:
  stage: release
  image:
    name: "$NODE_IMAGE"
  interruptible: false
  resource_group: release
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apk add --no-cache git
    - npm ci --cache .npm --prefer-offline --no-audit --no-fund
  script:
    - npm run release:publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^chore[(]release[)]: v[0-9]+[.][0-9]+[.][0-9]+( .*)?$/'


publish-release:
  stage: publish
  extends: .docker-job
  cache: []
  interruptible: false
  resource_group: "publication-$CI_COMMIT_REF_SLUG"
  timeout: 120 minutes
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $REPROMOTE_VERSION =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export RELEASE_VERSION="${CI_COMMIT_TAG#v}"
        export RELEASE_GIT_SHA="$CI_COMMIT_SHA"
        export BUILD_CANDIDATE=1
      else
        export RELEASE_VERSION="$REPROMOTE_VERSION"
        git fetch --force origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
        export RELEASE_GIT_SHA="$(git rev-list -n 1 "v$RELEASE_VERSION")"
        export BUILD_CANDIDATE=0
        git checkout --detach "$RELEASE_GIT_SHA"
      fi
      test "$(tr -d '\r\n' <version.txt)" = "$RELEASE_VERSION"
      release_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases/v$RELEASE_VERSION"
      for tentative in $(seq 1 12); do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" "$release_url" >/dev/null && break
        [ "$tentative" -lt 12 ] || exit 1
        sleep 5
      done
      export RELEASE_VERSION RELEASE_GIT_SHA BUILD_CANDIDATE
      ./scripts/ci-publish-release.sh
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 1 day
  after_script:
    - docker compose down --volumes --remove-orphans || true

deploy-recette:
  stage: deploy
  interruptible: false
  needs:
    - job: publish-release
      artifacts: true
  variables:
    APPLICATION: "$DEPLOY_APPLICATION"
    GIT_SHA: "$DEPLOY_GIT_SHA"
    VERSION: "$DEPLOY_VERSION"
  trigger:
    project: neitsablc/homelab-deploy
    branch: main
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $REPROMOTE_VERSION =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'

deploy-production:
  stage: deploy
  interruptible: false
  allow_failure: true
  needs:
    - job: publish-release
      artifacts: true
    - job: deploy-recette
      artifacts: false
  variables:
    APPLICATION: "$DEPLOY_APPLICATION"
    DEPLOY_ENVIRONMENT: "production"
    VERSION: "$DEPLOY_VERSION"
    CONFIRMATION: "production-$DEPLOY_VERSION"
    PRODUCTION_DEPLOY_REQUEST: "true"
  trigger:
    project: neitsablc/homelab-deploy
    branch: main
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $REPROMOTE_VERSION =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
