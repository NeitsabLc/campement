services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        PHP_VERSION: "${PHP_VERSION}"
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campement

  nginx:
    image: "nginx:${NGINX_VERSION}"
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/app:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - campement

  database:
    image: "postgres:${POSTGRES_VERSION}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campement

  liquibase:
    image: "liquibase:${LIQUIBASE_VERSION}"
    profiles:
      - tools
    working_dir: /liquibase/changelog
    volumes:
      - ./database/changelog:/liquibase/changelog:ro
    environment:
      LIQUIBASE_COMMAND_URL: "jdbc:postgresql://database:5432/${POSTGRES_DB}"
      LIQUIBASE_COMMAND_USERNAME: "${POSTGRES_USER}"
      LIQUIBASE_COMMAND_PASSWORD: "${POSTGRES_PASSWORD}"
      LIQUIBASE_COMMAND_CHANGELOG_FILE: "db.changelog-master.yaml"
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: "public"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - campement

volumes:
  database_data:

networks:
  campement:
